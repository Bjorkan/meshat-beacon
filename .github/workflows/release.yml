name: Release binaries

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: beacon-server/go.mod
          cache-dependency-path: beacon-server/go.sum
      - name: Build binaries
        working-directory: beacon-server
        run: ./build-release.sh
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: beacon-server/binaries/*
