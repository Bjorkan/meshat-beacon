name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Generated API drift
        run: npm run api:check --workspace=beacon-web
      - name: Prettier
        run: npm run format:check
      - name: Lint
        run: npm run lint:web
      - name: Test
        run: npm run test:web
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Production build and browser regressions
        run: npm run test:browser --workspace=beacon-web

  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacontest
          POSTGRES_DB: beacon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BEACON_TEST_DATABASE_URL: postgres://beacon:beacontest@localhost:5432/beacon_test?sslmode=disable
      BEACON_TEST_POSTGRES_DSN: postgres://beacon:beacontest@localhost:5432/beacon_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: beacon-server/go.mod
          cache-dependency-path: beacon-server/go.sum
      - name: Format check
        run: |
          files=$(gofmt -l beacon-server)
          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go -C beacon-server vet ./...
      - name: Initialize upstream integration schema
        run: |
          cat > "$RUNNER_TEMP/beacon-test-migrate.go" <<'GO'
          package main
          import (
            "context"
            "log"
            "os"
            "github.com/MeshCore-Beacon/beacon-server/db"
            "github.com/jackc/pgx/v5/pgxpool"
          )
          func main() {
            ctx := context.Background()
            pool, err := pgxpool.New(ctx, os.Getenv("BEACON_TEST_POSTGRES_DSN"))
            if err != nil { log.Fatal(err) }
            defer pool.Close()
            if err := db.RunMigrations(ctx, pool); err != nil { log.Fatal(err) }
          }
          GO
          go -C beacon-server run "$RUNNER_TEMP/beacon-test-migrate.go"
      - name: Test
        run: go -C beacon-server test ./...
      - name: Verify backup export and download against PostgreSQL 18
        run: |
          CGO_ENABLED=0 go -C beacon-server build -o "$RUNNER_TEMP/beacon-backup" ./cmd/beacon-backup
          CGO_ENABLED=0 go -C beacon-server test -c -o "$RUNNER_TEMP/backup.test" ./internal/backup
          CGO_ENABLED=0 go -C beacon-server test -c -o "$RUNNER_TEMP/backup-http.test" ./internal/api/router
          docker run --rm --network host \
            -e PGHOST=127.0.0.1 -e PGUSER=beacon -e PGDATABASE=beacon_test \
            -e PGPASSWORD=beacontest -e PGSSLMODE=disable \
            -e BEACON_BACKUP_TEST_POSTGRES=1 -e BEACON_BACKUP_TEST_BINARY=/beacon-backup \
            -v "$RUNNER_TEMP/beacon-backup:/beacon-backup:ro" \
            -v "$RUNNER_TEMP/backup.test:/backup.test:ro" \
            postgres:18-alpine /backup.test -test.run '^TestExportPostgres$' -test.v
          docker run --rm --network host \
            -e PGHOST=127.0.0.1 -e PGUSER=beacon -e PGDATABASE=beacon_test \
            -e PGPASSWORD=beacontest -e PGSSLMODE=disable -e BEACON_BACKUP_TEST_POSTGRES=1 \
            -v "$RUNNER_TEMP/backup-http.test:/backup-http.test:ro" \
            postgres:18-alpine /backup-http.test -test.run '^TestBackupDownloadPostgres$' -test.v
      - name: Build
        run: go -C beacon-server build ./...
      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest
      - name: Swagger docs up to date
        working-directory: beacon-server
        run: |
          cp docs/swagger.json docs/swagger.json.bak
          swag init -g cmd/beacon/main.go -o docs --parseInternal --parseDependency
          diff -q docs/swagger.json docs/swagger.json.bak

  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    needs: [web, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: meshat-beacon-web
            context: .
            dockerfile: beacon-web/.build/Dockerfile
          - image: meshat-beacon-server
            context: beacon-server
            dockerfile: beacon-server/.build/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/bjorkan/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
