name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Generated API drift
        run: npm run api:check --workspace=beacon-web
      - name: Prettier
        run: npm run format:check
      - name: Lint
        run: npm run lint:web
      - name: Test
        run: npm run test:web
      - name: Build
        run: npm run build:web

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: beacon-server/go.mod
          cache-dependency-path: beacon-server/go.sum
      - name: Format check
        run: |
          files=$(gofmt -l beacon-server)
          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go -C beacon-server vet ./...
      - name: Test
        run: go -C beacon-server test ./...
      - name: Build
        run: go -C beacon-server build ./...
      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest
      - name: Swagger docs up to date
        working-directory: beacon-server
        run: |
          cp docs/swagger.json docs/swagger.json.bak
          swag init -g cmd/beacon/main.go -o docs --parseInternal --parseDependency
          diff -q docs/swagger.json docs/swagger.json.bak

  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    needs: [web, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: meshat-beacon-web
            context: .
            dockerfile: beacon-web/.build/Dockerfile
          - image: meshat-beacon-server
            context: beacon-server
            dockerfile: beacon-server/.build/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/bjorkan/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
