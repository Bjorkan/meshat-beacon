name: Server test coverage

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacontest
          POSTGRES_DB: beacon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BEACON_TEST_DATABASE_URL: postgres://beacon:beacontest@localhost:5432/beacon_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version-file: beacon-server/go.mod
          cache-dependency-path: beacon-server/go.sum
      - name: Run tests with coverage
        working-directory: beacon-server
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Filter generated files
        working-directory: beacon-server
        run: grep -v -e "db/sqlc" -e "docs" -e "iatadb/gen" coverage.out > coverage.filtered.out
      - name: Display coverage
        working-directory: beacon-server
        run: go tool cover -func=coverage.filtered.out
