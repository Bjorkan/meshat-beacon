name: Server test coverage

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version-file: beacon-server/go.mod
          cache-dependency-path: beacon-server/go.sum
      - name: Run tests with coverage
        working-directory: beacon-server
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Filter generated files
        working-directory: beacon-server
        run: grep -v -e "db/sqlc" -e "docs" -e "iatadb/gen" coverage.out > coverage.filtered.out
      - name: Display coverage
        working-directory: beacon-server
        run: go tool cover -func=coverage.filtered.out
